name: release

# Cuts a GitHub Release with the built APK whenever a version tag is pushed (e.g. `v0.4`),
# or when run manually from the Actions tab against a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create the release + upload assets

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest   # the bundled/older tools' package index predates API 37

      # compileSdk/targetSdk = 37 (Android 17). The platform uses Android's minor-version scheme, so
      # the sdkmanager package id is "platforms;android-37.0" (NOT "android-37" — that id doesn't
      # exist and is why a plain install fails). build-tools 36.0.0 is what AGP 9.1 resolves to.
      - name: Install SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # Decode the release keystore from a base64 secret. If the secret is unset, the build falls
      # back to debug signing (see Orchestra/app/build.gradle.kts) so the workflow still produces an
      # installable APK — but note: consistent updates require a STABLE key, so set these secrets:
      #   ORCHESTRA_KEYSTORE_BASE64, ORCHESTRA_KEYSTORE_PASSWORD, ORCHESTRA_KEY_ALIAS, ORCHESTRA_KEY_PASSWORD
      - name: Decode release keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ORCHESTRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "No keystore secret set — building debug-signed (NOT suitable for stable updates)."
          fi

      - name: Build release APK
        working-directory: Orchestra
        env:
          ORCHESTRA_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ORCHESTRA_KEYSTORE_PASSWORD: ${{ secrets.ORCHESTRA_KEYSTORE_PASSWORD }}
          ORCHESTRA_KEY_ALIAS: ${{ secrets.ORCHESTRA_KEY_ALIAS }}
          ORCHESTRA_KEY_PASSWORD: ${{ secrets.ORCHESTRA_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        id: apk
        env:
          REF_NAME: ${{ github.ref_name }}   # via env (not inlined) — tags can carry shell metachars
        run: |
          SRC=$(find Orchestra/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC" || { echo "No APK produced"; exit 1; }
          # sanitize the tag for use as a filename (strip anything outside [A-Za-z0-9._-])
          SAFE_REF=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '_')
          OUT="orchestra-${SAFE_REF}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT from $SRC"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Orchestra ${{ github.ref_name }}

            LSPosed module + app — native Soundcore controls on Pixel / Android. Install the APK,
            enable in LSPosed (scope: System UI + Settings + Orchestra), restart System UI, then hook
            a device in the app. See the README for setup and supported devices.
